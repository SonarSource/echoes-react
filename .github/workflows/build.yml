name: Build
on:
  push:
    branches:
      - main
      - branch-*
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: sonar-s
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
      - name: Build, Test, Analyze and deploy
        uses: SonarSource/ci-github-actions/build-yarn@8876c7fe204d24e65942a09badca69262c1b16e6 # 2.5.3
        with:
          artifactory-reader-role: public-reader
          artifactory-deploy-repo: sonarsource-npm-public-qa
          artifactory-deployer-role: qa-deployer
          deploy-pull-request: true
          sonar-platform: next
          cache-yarn: true

  promote:
    name: Promote
    needs:
      - build
    runs-on: sonar-xs-public
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: SonarSource/ci-github-actions/promote@8876c7fe204d24e65942a09badca69262c1b16e6 # 2.5.3
        with:
          promote-pull-request: true

  slack-notifications:
    runs-on: warp-custom-ubuntu-24-04 # Public GH runner is required, runners starting with sonar-* do not support this action
    if: failure() && (contains(fromJSON('["main", "master"]'), github.ref_name) || startsWith(github.ref_name, 'branch-'))
    needs: [ build, promote ]
    permissions:
      id-token: write
    steps:
      - name: Vault Secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/slack token | SLACK_TOKEN;

      - name: Slack Notification rtCamp
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4  # v2.4.1
        env:
          SLACK_TOKEN: >-
            ${{ fromJSON(steps.secrets.outputs.vault).SLACK_TOKEN }}
          SLACK_CHANNEL: ops-sonarcloud-webapp
          SLACK_TITLE: Build failed 🚨
          SLACK_USERNAME: BuildBot
          SLACK_COLOR: danger
          SLACK_MESSAGE: |
            Workflow failed in ${{ github.repository }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Branch: ${{ github.head_ref || github.ref_name }}
