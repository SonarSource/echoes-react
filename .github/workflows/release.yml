name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Full version including build number, e.g. 6.3.0-8276'
        required: true

jobs:
  release:
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@0c9c1cc54cbdd24258f135601d1b77cfc87e67ae # 7.4.0
    with:
      publishToNpmJS: true
      skipJavascriptReleasabilityChecks: false
      useNpmTrustedPublisher: true
      githubEnvironment: release
      version: ${{ inputs.version }}
    permissions:
      id-token: write
      contents: write

  slack-notifications:
    runs-on: warp-custom-ubuntu-24-04 # Public GH runner is required, runners starting with sonar-* do not support this action
    needs: [ release ]
    permissions:
      id-token: write
    steps:
      - name: Vault Secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/slack token | SLACK_TOKEN;

      - name: Slack Notification
        uses: step-security/action-slack-notify@e4cdee14a905d9da46ba47ad9309704407d8cd79 # v2.4.0
        env:
          SLACK_TOKEN: >-
            ${{ fromJSON(steps.secrets.outputs.vault).SLACK_TOKEN }}
          SLACK_CHANNEL: ops-sonarcloud-webapp
          SLACK_TITLE: "Release ${{ job.status == 'failure' && 'Failed 🚨' || 'Succeeded 🎉' }}"
          SLACK_USERNAME: BuildBot
          SLACK_COLOR: ${{ job.status }}
          SLACK_MESSAGE: |
            Workflow in ${{ github.repository }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Branch: ${{ github.head_ref || github.ref_name }}
            Released version: ${{ inputs.version }}
